[project]
name = "uth-mail-mcp"
version = "0.1.0"
description = "MCP server για το email του Πανεπιστημίου Θεσσαλίας: αναζήτηση, ανάγνωση, συνημμένα, πρόχειρα και αποστολή"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Fotis Petrou" }]
dependencies = [
    "mcp>=2",
    "beautifulsoup4>=4.12",
    "keyring>=24",
]

[project.urls]
Repository = "https://github.com/fotispetrou/uth-mail-mcp"

[project.scripts]
uth-mail-mcp = "uth_mail_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uth_mail_mcp"]

[dependency-groups]
dev = ["pytest>=8"]
